name: Release & Build Executables

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: image-dataset-curator-linux-x86_64
            asset_name: image-dataset-curator-linux-x86_64
          - os: windows-latest
            artifact_name: image-dataset-curator-windows-x86_64.exe
            asset_name: image-dataset-curator-windows-x86_64.exe
          - os: macos-latest
            artifact_name: image-dataset-curator-macos-arm64
            asset_name: image-dataset-curator-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies and packaging tools
        run: uv sync --dev

      - name: Build standalone executable with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller \
            --name image-dataset-curator \
            --onefile \
            --collect-all image_dataset_curator \
            src/image_dataset_curator/cli.py

      - name: Rename binary for platform
        shell: bash
        run: |
          mkdir -p dist_release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/image-dataset-curator.exe dist_release/${{ matrix.artifact_name }}
          else
            chmod +x dist/image-dataset-curator
            mv dist/image-dataset-curator dist_release/${{ matrix.artifact_name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist_release/${{ matrix.artifact_name }}

  build-wheels:
    name: Build Python Wheels & Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/image-dataset-curator-linux-x86_64/image-dataset-curator-linux-x86_64
            release_assets/image-dataset-curator-windows-x86_64.exe/image-dataset-curator-windows-x86_64.exe
            release_assets/image-dataset-curator-macos-arm64/image-dataset-curator-macos-arm64
            release_assets/python-packages/*
          generate_release_notes: true
