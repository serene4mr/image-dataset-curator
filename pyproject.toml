[project]
name = "image-dataset-curator"
version = "0.1.1"
description = "Multi-Stage Image Dataset Deduplication and Diversity Curation for Computer Vision & Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "zeki-aitech", email = "trungnh.aitech@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
deep = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
]
all = [
    "image-dataset-curator[deep]",
]

[project.scripts]
image-dataset-curator = "image_dataset_curator.cli:main"
img-curator = "image_dataset_curator.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_xmllint -v"
testpaths = ["tests"]
